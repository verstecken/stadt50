<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
      background: #f5f5f5;
      color: #111;
      line-height: 1.4;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem; }
    .key-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .key-btn {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      border: 2px solid #ccc;
      background: #fff;
      color: #333;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .key-btn:hover { border-color: #888; }
    .key-btn.active {
      border-color: #111;
      background: #111;
      color: #fff;
    }
    .key-btn.has-content:not(.active) { border-color: #666; }
    .panel { max-width: 36rem; }
    .slot { display: none; border: 1px solid #ddd; background: #fff; padding: 1.25rem; border-radius: 4px; }
    .slot.active { display: block; }
    .fields { display: grid; gap: 1rem; }
    .fields label { display: grid; gap: 0.35rem; font-size: 0.875rem; color: #444; }
    .extra-fields { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #eee; display: none; gap: 1rem; }
    .extra-fields.visible { display: grid; }
    .audio-fields { grid-template-columns: 1fr 1fr; }
    .gallery-meta { display: none; gap: 1rem; }
    .gallery-meta.visible { display: grid; }
    .extra-fields .hint { font-size: 0.8rem; color: #888; font-weight: 500; }
    .extra-fields label.full { grid-column: 1 / -1; }
    .gallery-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .gallery-list li { display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; }
    .gallery-list img { width: 3rem; height: 3rem; object-fit: cover; flex-shrink: 0; border-radius: 2px; }
    .gallery-list span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #666; }
    .gallery-list button {
      width: auto;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      font: inherit;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 3px;
    }
    .gallery-add {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .gallery-add select {
      flex: 1;
      min-width: 0;
      font: inherit;
      padding: 0.5rem 0.65rem;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 3px;
    }
    .gallery-add-btn {
      flex-shrink: 0;
      width: auto;
      white-space: nowrap;
      cursor: pointer;
      font: inherit;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 3px;
    }
    .fields input,
    .fields select,
    .fields textarea,
    .extra-fields label input,
    .extra-fields label select,
    .extra-fields label textarea {
      font: inherit;
      padding: 0.5rem 0.65rem;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 3px;
      width: 100%;
    }
    textarea { min-height: 5rem; resize: vertical; line-height: 1.5; }
    .actions { margin-top: 1.5rem; min-height: 1.5rem; }
    #saved-msg {
      font-size: 0.875rem;
      font-weight: 500;
      color: #1a7f37;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    #saved-msg.visible { opacity: 1; }
    #saved-msg.error { color: #b42318; }
    @media (max-width: 520px) {
      .audio-fields { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>Button-Zuordnungen</h1>
  <div class="key-picker" id="key-picker"></div>
  <div class="panel">
    <div id="slots"></div>
  </div>
  <div class="actions">
    <span id="saved-msg"></span>
  </div>
  <script>
    const KEYS = 'abcdefghij'.split('');
    const MAX_GALLERY = 10;
    const slots = document.getElementById('slots');
    const keyPicker = document.getElementById('key-picker');
    const savedMsg = document.getElementById('saved-msg');
    let media = [];
    let activeKey = 'a';
    let loading = true;
    let saveTimer = null;
    let saveInFlight = false;
    let pendingSave = false;
    let savedFadeTimer = null;
    const SAVE_DELAY = 1500;

    function slotEl(key) {
      const div = document.createElement('div');
      div.className = 'slot';
      div.dataset.key = key;
      div.innerHTML = `
        <div class="fields">
          <label>Datei
            <select class="file" data-key="${key}"></select>
          </label>
          <label>Titel
            <input class="title" data-key="${key}" placeholder="Titel">
          </label>
        </div>
        <div class="extra-fields audio-fields" data-type="audio" data-key="${key}">
          <span class="hint">Audio-Inhalt</span>
          <label>Untertitel
            <input class="subtitle" data-key="${key}" placeholder="Untertitel">
          </label>
          <label>Bild (optional)
            <select class="cover" data-key="${key}"></select>
          </label>
          <label class="full">Text
            <textarea class="text" data-key="${key}" placeholder="Fließtext"></textarea>
          </label>
        </div>
        <div class="extra-fields gallery-fields" data-type="gallery" data-key="${key}">
          <span class="hint">Bild</span>
          <div class="gallery-meta">
            <label>Untertitel
              <input class="subtitle" data-key="${key}" placeholder="Untertitel">
            </label>
            <label class="full">Text
              <textarea class="text" data-key="${key}" placeholder="Fließtext"></textarea>
            </label>
          </div>
          <ul class="gallery-list" data-key="${key}"></ul>
          <div class="gallery-add">
            <select class="gallery-pick" data-key="${key}"></select>
            <button type="button" class="gallery-add-btn" data-key="${key}">Weiteres Bild</button>
          </div>
        </div>
      `;
      return div;
    }

    function keyBtnEl(key) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'key-btn';
      btn.dataset.key = key;
      btn.textContent = key;
      btn.addEventListener('click', () => selectKey(key));
      return btn;
    }

    function selectKey(key) {
      activeKey = key;
      document.querySelectorAll('.key-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.key === key);
      });
      document.querySelectorAll('.slot').forEach(slot => {
        slot.classList.toggle('active', slot.dataset.key === key);
      });
    }

    function updateKeyIndicators() {
      document.querySelectorAll('.key-btn').forEach(btn => {
        const key = btn.dataset.key;
        const file = $(key, 'file').value;
        const images = getGalleryImages(key);
        btn.classList.toggle('has-content', !!(file || images.length));
      });
    }

    function slotRoot(key) {
      return document.querySelector(`.slot[data-key="${key}"]`);
    }

    function $(key, cls) {
      return slotRoot(key).querySelector(`.${cls}`);
    }

    function extraBlock(key, type) {
      return slotRoot(key).querySelector(`.extra-fields[data-type="${type}"]`);
    }

    function enrichMedia(list) {
      return list.map(f => ({ ...f, kind: f.kind || fileKind(f.path) || 'other' }));
    }

    function fileExt(path) {
      if (!path || !path.includes('.')) return '';
      return path.split('.').pop().toLowerCase();
    }

    function fileKind(path) {
      const ext = fileExt(path);
      if (['mp4', 'webm', 'mov', 'm4v'].includes(ext)) return 'video';
      if (['mp3', 'wav', 'wave', 'ogg', 'm4a', 'aac', 'flac'].includes(ext)) return 'audio';
      if (['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp', 'tif', 'tiff'].includes(ext)) return 'image';
      return null;
    }

    function fillFileSelect(sel, selected) {
      sel.innerHTML = '<option value="">— leer —</option>';
      media.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.path;
        opt.textContent = `${f.name} (${f.kind})`;
        if (selected === f.path) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function fillImageSelect(sel, selected) {
      sel.innerHTML = '<option value="">— keins —</option>';
      media.filter(f => fileKind(f.path) === 'image').forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.path;
        opt.textContent = f.name;
        if (selected === f.path) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function getGalleryImages(key) {
      return [...$(key, 'gallery-list').querySelectorAll('li')].map(li => li.dataset.path);
    }

    function adminMediaUrl(path) {
      const i = path.lastIndexOf('/');
      if (i === -1) return encodeURIComponent(path);
      return path.slice(0, i + 1) + encodeURIComponent(path.slice(i + 1));
    }

    function renderGalleryList(key, paths) {
      const list = $(key, 'gallery-list');
      list.innerHTML = '';
      paths.forEach(path => {
        const li = document.createElement('li');
        li.dataset.path = path;
        li.innerHTML = `
          <img src="/${adminMediaUrl(path)}" alt="">
          <span>${path.split('/').pop()}</span>
          <button type="button">×</button>
        `;
        li.querySelector('button').addEventListener('click', () => {
          li.remove();
          syncFileFromGallery(key);
          updateFields(key);
          updateKeyIndicators();
          scheduleSave();
        });
        list.appendChild(li);
      });
    }

    function syncFileFromGallery(key) {
      const paths = getGalleryImages(key);
      $(key, 'file').value = paths[0] || '';
    }

    function addGalleryImage(key, path) {
      if (!path) return;
      const paths = getGalleryImages(key);
      if (paths.includes(path) || paths.length >= MAX_GALLERY) return;
      paths.push(path);
      renderGalleryList(key, paths);
      syncFileFromGallery(key);
      updateFields(key);
      updateKeyIndicators();
      scheduleSave();
    }

    function updateFields(key) {
      const file = $(key, 'file').value;
      const kind = fileKind(file);
      const images = getGalleryImages(key);
      const gallery = extraBlock(key, 'gallery');
      extraBlock(key, 'audio').classList.toggle('visible', kind === 'audio');
      gallery.classList.toggle('visible', kind === 'image' || images.length > 0);
      gallery.querySelector('.gallery-meta').classList.toggle('visible', images.length > 1);
      gallery.querySelector('.hint').textContent = images.length > 1 ? 'Galerie' : 'Bild';
    }

    function buildConfig() {
      const config = {};
      KEYS.forEach(key => {
        const file = $(key, 'file').value;
        const images = getGalleryImages(key);
        const title = $(key, 'title').value.trim();
        if (images.length > 1) {
          const g = extraBlock(key, 'gallery');
          config[key] = {
            images,
            title,
            subtitle: g.querySelector('.subtitle').value.trim(),
            text: g.querySelector('.text').value.trim(),
          };
          return;
        }
        if (images.length === 1) {
          config[key] = { file: images[0], title };
          return;
        }
        if (!file) {
          config[key] = null;
          return;
        }
        const entry = { file, title };
        if (fileKind(file) === 'audio') {
          const a = extraBlock(key, 'audio');
          entry.subtitle = a.querySelector('.subtitle').value.trim();
          entry.text = a.querySelector('.text').value.trim();
          const cover = $(key, 'cover').value;
          if (cover) entry.image = cover;
        }
        config[key] = entry;
      });
      return config;
    }

    function showSavedMessage(text, isError = false) {
      clearTimeout(savedFadeTimer);
      savedMsg.textContent = text;
      savedMsg.classList.toggle('error', isError);
      savedMsg.classList.add('visible');
      savedFadeTimer = setTimeout(() => {
        savedMsg.classList.remove('visible');
        setTimeout(() => {
          if (!savedMsg.classList.contains('visible')) savedMsg.textContent = '';
        }, 500);
      }, 2000);
    }

    async function saveNow() {
      if (loading) return;
      if (saveInFlight) {
        pendingSave = true;
        return;
      }
      saveInFlight = true;
      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(buildConfig()),
        });
        const data = await res.json();
        if (data.ok) {
          showSavedMessage('Gespeichert!');
          updateKeyIndicators();
        } else {
          showSavedMessage(data.error || 'Fehler', true);
        }
      } catch (e) {
        showSavedMessage('Fehler', true);
      } finally {
        saveInFlight = false;
        if (pendingSave) {
          pendingSave = false;
          saveNow();
        }
      }
    }

    function scheduleSave() {
      if (loading) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, SAVE_DELAY);
    }

    KEYS.forEach(k => {
      keyPicker.appendChild(keyBtnEl(k));
      slots.appendChild(slotEl(k));
    });
    selectKey('a');

    KEYS.forEach(key => {
      $(key, 'file').addEventListener('change', () => {
        const file = $(key, 'file').value;
        if (fileKind(file) === 'image') {
          if (!getGalleryImages(key).length) renderGalleryList(key, [file]);
          else syncFileFromGallery(key);
        } else {
          renderGalleryList(key, []);
        }
        fillImageSelect($(key, 'cover'), $(key, 'cover').value);
        fillImageSelect($(key, 'gallery-pick'), '');
        updateFields(key);
        updateKeyIndicators();
        scheduleSave();
      });

      $(key, 'gallery-add-btn').addEventListener('click', () => {
        addGalleryImage(key, $(key, 'gallery-pick').value);
        $(key, 'gallery-pick').value = '';
      });
    });

    slots.addEventListener('input', scheduleSave);
    slots.addEventListener('change', scheduleSave);

    async function load() {
      const [mediaList, config] = await Promise.all([
        fetch('/api/media').then(r => r.json()),
        fetch('/api/config').then(r => r.json()),
      ]);
      media = enrichMedia(mediaList);
      let firstWithContent = null;
      KEYS.forEach(key => {
        const entry = config[key];
        const images = entry?.images || [];
        const file = entry?.file || images[0] || '';
        if ((file || images.length) && !firstWithContent) firstWithContent = key;
        fillFileSelect($(key, 'file'), file);
        fillImageSelect($(key, 'cover'), entry?.image || '');
        fillImageSelect($(key, 'gallery-pick'), '');
        $(key, 'title').value = entry?.title || '';
        const kind = images.length > 1 ? 'gallery' : fileKind(file);
        if (kind === 'gallery') {
          extraBlock(key, 'gallery').querySelector('.subtitle').value = entry?.subtitle || '';
          extraBlock(key, 'gallery').querySelector('.text').value = entry?.text || '';
          renderGalleryList(key, images);
        } else if (kind === 'audio') {
          extraBlock(key, 'audio').querySelector('.subtitle').value = entry?.subtitle || '';
          extraBlock(key, 'audio').querySelector('.text').value = entry?.text || '';
          renderGalleryList(key, []);
        } else if (kind === 'image' || images.length === 1) {
          renderGalleryList(key, images.length ? images : [file]);
        } else {
          renderGalleryList(key, []);
        }
        updateFields(key);
      });
      updateKeyIndicators();
      if (firstWithContent) selectKey(firstWithContent);
      loading = false;
    }

    load();
  </script>
</body>
</html>

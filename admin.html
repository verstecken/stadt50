<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { font-family: ui-monospace, monospace; padding: 2rem; background: #fafafa; color: #111; }
    h1 { font-size: 1rem; font-weight: normal; margin-bottom: 1.5rem; }
    .slots { display: flex; flex-direction: column; gap: 1rem; max-width: 40rem; }
    .slot { border: 1px solid #ccc; background: #fff; padding: 1rem; }
    .slot-head { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
    .slot-head .key { width: 1.5rem; text-align: center; font-size: 1.1rem; }
    .slot-head select { flex: 1; }
    .fields { display: grid; gap: 0.5rem; }
    .fields label { display: grid; gap: 0.25rem; font-size: 0.75rem; color: #666; }
    .extra-fields { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid #eee; display: none; gap: 0.5rem; }
    .extra-fields.visible { display: grid; }
    .audio-fields { grid-template-columns: 1fr 1fr; }
    .gallery-fields { grid-template-columns: 1fr; }
    .extra-fields .hint { font-size: 0.7rem; color: #999; }
    .extra-fields label.full { grid-column: 1 / -1; }
    .gallery-list { list-style: none; display: flex; flex-direction: column; gap: 0.35rem; }
    .gallery-list li { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; }
    .gallery-list img { width: 2.5rem; height: 2.5rem; object-fit: cover; flex-shrink: 0; }
    .gallery-list span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gallery-list button { width: auto; padding: 0.15rem 0.4rem; cursor: pointer; }
    .gallery-add { display: flex; gap: 0.5rem; align-items: center; }
    .gallery-add select { flex: 1; }
    .gallery-add button { width: auto; white-space: nowrap; cursor: pointer; }
    input, select, textarea, button { font: inherit; padding: 0.4rem 0.5rem; border: 1px solid #ccc; background: #fff; width: 100%; }
    textarea { min-height: 4rem; resize: vertical; line-height: 1.4; }
    .actions { margin-top: 1.5rem; display: flex; gap: 1rem; align-items: center; max-width: 40rem; }
    #status { color: #666; }
    a { color: inherit; }
  </style>
</head>
<body>
  <h1>Button-Zuordnungen</h1>
  <form id="form">
    <div class="slots" id="slots"></div>
    <div class="actions">
      <button type="submit">Speichern</button>
      <span id="status"></span>
      <a href="/">index</a>
    </div>
  </form>
  <script>
    const KEYS = 'abcdefghij'.split('');
    const MAX_GALLERY = 10;
    const slots = document.getElementById('slots');
    const status = document.getElementById('status');
    let media = [];

    function slotEl(key) {
      const div = document.createElement('div');
      div.className = 'slot';
      div.dataset.key = key;
      div.innerHTML = `
        <div class="slot-head">
          <span class="key">${key}</span>
          <select class="file" data-key="${key}"></select>
        </div>
        <div class="fields">
          <label>Titel
            <input class="title" data-key="${key}" placeholder="Titel">
          </label>
        </div>
        <div class="extra-fields audio-fields" data-type="audio" data-key="${key}">
          <span class="hint">Audio-Inhalt</span>
          <label>Untertitel
            <input class="subtitle" data-key="${key}" placeholder="Untertitel">
          </label>
          <label>Bild (optional)
            <select class="cover" data-key="${key}"></select>
          </label>
          <label class="full">Text
            <textarea class="text" data-key="${key}" placeholder="Fließtext"></textarea>
          </label>
        </div>
        <div class="extra-fields gallery-fields" data-type="gallery" data-key="${key}">
          <span class="hint">Galerie</span>
          <label>Untertitel
            <input class="subtitle" data-key="${key}" placeholder="Untertitel">
          </label>
          <label class="full">Text
            <textarea class="text" data-key="${key}" placeholder="Fließtext"></textarea>
          </label>
          <ul class="gallery-list" data-key="${key}"></ul>
          <div class="gallery-add">
            <select class="gallery-pick" data-key="${key}"></select>
            <button type="button" class="gallery-add-btn" data-key="${key}">Weiteres Bild auswählen</button>
          </div>
        </div>
      `;
      return div;
    }

    function slotRoot(key) {
      return document.querySelector(`.slot[data-key="${key}"]`);
    }

    function $(key, cls) {
      return slotRoot(key).querySelector(`.${cls}`);
    }

    function extraBlock(key, type) {
      return slotRoot(key).querySelector(`.extra-fields[data-type="${type}"]`);
    }

    function enrichMedia(list) {
      return list.map(f => ({ ...f, kind: f.kind || fileKind(f.path) || 'other' }));
    }

    function fileExt(path) {
      if (!path || !path.includes('.')) return '';
      return path.split('.').pop().toLowerCase();
    }

    function fileKind(path) {
      const ext = fileExt(path);
      if (['mp4', 'webm', 'mov', 'm4v'].includes(ext)) return 'video';
      if (['mp3', 'wav', 'wave', 'ogg', 'm4a', 'aac', 'flac'].includes(ext)) return 'audio';
      if (['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp', 'tif', 'tiff'].includes(ext)) return 'image';
      return null;
    }

    function fillFileSelect(sel, selected) {
      sel.innerHTML = '<option value="">— leer —</option>';
      media.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.path;
        opt.textContent = `${f.name} (${f.kind})`;
        if (selected === f.path) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function fillImageSelect(sel, selected) {
      sel.innerHTML = '<option value="">— keins —</option>';
      media.filter(f => fileKind(f.path) === 'image').forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.path;
        opt.textContent = f.name;
        if (selected === f.path) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function getGalleryImages(key) {
      return [...$(key, 'gallery-list').querySelectorAll('li')].map(li => li.dataset.path);
    }

    function adminMediaUrl(path) {
      const i = path.lastIndexOf('/');
      if (i === -1) return encodeURIComponent(path);
      return path.slice(0, i + 1) + encodeURIComponent(path.slice(i + 1));
    }

    function renderGalleryList(key, paths) {
      const list = $(key, 'gallery-list');
      list.innerHTML = '';
      paths.forEach(path => {
        const li = document.createElement('li');
        li.dataset.path = path;
        li.innerHTML = `
          <img src="/${adminMediaUrl(path)}" alt="">
          <span>${path.split('/').pop()}</span>
          <button type="button">×</button>
        `;
        li.querySelector('button').addEventListener('click', () => {
          li.remove();
          syncFileFromGallery(key);
          updateFields(key);
        });
        list.appendChild(li);
      });
    }

    function syncFileFromGallery(key) {
      const paths = getGalleryImages(key);
      $(key, 'file').value = paths[0] || '';
    }

    function addGalleryImage(key, path) {
      if (!path) return;
      const paths = getGalleryImages(key);
      if (paths.includes(path) || paths.length >= MAX_GALLERY) return;
      paths.push(path);
      renderGalleryList(key, paths);
      syncFileFromGallery(key);
      updateFields(key);
    }

    function updateFields(key) {
      const file = $(key, 'file').value;
      const kind = fileKind(file);
      extraBlock(key, 'audio').classList.toggle('visible', kind === 'audio');
      extraBlock(key, 'gallery').classList.toggle('visible', kind === 'image' || getGalleryImages(key).length > 0);
    }

    KEYS.forEach(k => slots.appendChild(slotEl(k)));

    KEYS.forEach(key => {
      $(key, 'file').addEventListener('change', () => {
        const file = $(key, 'file').value;
        if (fileKind(file) === 'image') {
          if (!getGalleryImages(key).length) renderGalleryList(key, [file]);
          else syncFileFromGallery(key);
        } else {
          renderGalleryList(key, []);
        }
        fillImageSelect($(key, 'cover'), $(key, 'cover').value);
        fillImageSelect($(key, 'gallery-pick'), '');
        updateFields(key);
      });

      $(key, 'gallery-add-btn').addEventListener('click', () => {
        addGalleryImage(key, $(key, 'gallery-pick').value);
        $(key, 'gallery-pick').value = '';
      });
    });

    async function load() {
      const [mediaList, config] = await Promise.all([
        fetch('/api/media').then(r => r.json()),
        fetch('/api/config').then(r => r.json()),
      ]);
      media = enrichMedia(mediaList);
      KEYS.forEach(key => {
        const entry = config[key];
        const images = entry?.images || [];
        const file = entry?.file || images[0] || '';
        fillFileSelect($(key, 'file'), file);
        fillImageSelect($(key, 'cover'), entry?.image || '');
        fillImageSelect($(key, 'gallery-pick'), '');
        $(key, 'title').value = entry?.title || '';
        const kind = images.length ? 'gallery' : fileKind(file);
        if (kind === 'gallery') {
          extraBlock(key, 'gallery').querySelector('.subtitle').value = entry?.subtitle || '';
          extraBlock(key, 'gallery').querySelector('.text').value = entry?.text || '';
          renderGalleryList(key, images);
        } else if (kind === 'audio') {
          extraBlock(key, 'audio').querySelector('.subtitle').value = entry?.subtitle || '';
          extraBlock(key, 'audio').querySelector('.text').value = entry?.text || '';
          renderGalleryList(key, []);
        } else {
          renderGalleryList(key, []);
        }
        updateFields(key);
      });
    }

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const config = {};
      KEYS.forEach(key => {
        const file = $(key, 'file').value;
        const images = getGalleryImages(key);
        const title = $(key, 'title').value.trim();
        if (images.length) {
          const g = extraBlock(key, 'gallery');
          config[key] = {
            images,
            title,
            subtitle: g.querySelector('.subtitle').value.trim(),
            text: g.querySelector('.text').value.trim(),
          };
          return;
        }
        if (!file) {
          config[key] = null;
          return;
        }
        const entry = { file, title };
        if (fileKind(file) === 'audio') {
          const a = extraBlock(key, 'audio');
          entry.subtitle = a.querySelector('.subtitle').value.trim();
          entry.text = a.querySelector('.text').value.trim();
          const cover = $(key, 'cover').value;
          if (cover) entry.image = cover;
        }
        config[key] = entry;
      });
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(config),
      });
      const data = await res.json();
      status.textContent = data.ok ? 'gespeichert' : (data.error || 'Fehler');
      setTimeout(() => status.textContent = '', 2000);
    });

    load();
  </script>
</body>
</html>
